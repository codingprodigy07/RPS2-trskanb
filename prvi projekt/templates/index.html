<!DOCTYPE html>
<html>
<head>
<title>My first flask project!</title>
</head>
<body>

<h1>My First Template</h1>
<p>Hello 2.Ri! ♥</p>
{% if podatki['uspeh'] %}
<i>Uspešno sem se povezal na database.</i>
{% else %}
<i><b>Neuspešno</b> sem se povezal na database.</i>
{% endif %}

<br><br>
<form action="/" method="POST">
  <label for="visinaID">Višina (cm):</label><br>
  <input type="text" id="visinaID" name="visina" value="{{podatki['visina']}}"><br>
  <label for="tezaID">Teža (kg):</label><br>
  <input type="text" id="tezaID" name="teza" value="{{podatki['teza']}}"><br><br>
  <input type="submit" value="IZRAČUNAJ">
</form>

{% if podatki['itm'] %}
<i>Vaš ITM je {{podatki['itm']}}</i>
{% endif %}



</body>
</html>
